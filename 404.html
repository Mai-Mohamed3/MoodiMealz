<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // خزن الـ path الأصلي كامل (المسار + query + hash)
      var redirectTo = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.redirect = redirectTo;

      // رجّع المستخدم للـ index.html (بتاع MoodiMealz)
      window.location.href = "/MoodiMealz/";
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
  </body>
</html>
